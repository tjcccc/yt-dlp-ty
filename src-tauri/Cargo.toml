[package]
name = "yt-dlp-ty"
version = "0.2.0"
description = "A cross-platform GUI for yt-dlp"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yt_dlp_ty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for a transparent window with a native
# vibrancy material behind it. It uses private AppKit API, which disqualifies
# Mac App Store submission — an accepted trade-off for a direct-download tool,
# recorded as a non-goal in CLAUDE.md rather than an accident.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
shell-words = "1"
dirs = "5"
chrono = "0.4"
# `bundled` compiles SQLite into the binary rather than linking a system
# copy. That matters for the Windows and Fedora builds: no libsqlite3 to
# install, and every platform gets the same version.
rusqlite = { version = "0.32", features = ["bundled"] }

